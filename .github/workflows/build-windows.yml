name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "roblox_name_gen.py"
      - "requirements.txt"
      - "icon.ico"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply v2.1.2 signup-route fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("roblox_name_gen.py")
          source = path.read_text(encoding="utf-8")

          source = re.sub(
              r'APP_VER\s*=\s*"[^"]+"',
              'APP_VER = "2.1.2"',
              source,
              count=1,
          )

          source = re.sub(
              r'ROBLOX_REGISTRATION_URL\s*=\s*"[^"]+"',
              'ROBLOX_REGISTRATION_URL = "https://www.roblox.com/CreateAccount"',
              source,
              count=1,
          )

          path.write_text(source, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 patch_v212.py

          python patch_v212.py
          python -m py_compile roblox_name_gen.py

      - name: Commit v2.1.2 source fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roblox_name_gen.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix Roblox signup route in v2.1.2 [skip ci]"
            git push
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Scarn's Name Sniffer
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") {
            python -m PyInstaller --onefile --clean --noconfirm --name "ScarnsNameSniffer" --icon "icon.ico" roblox_name_gen.py
          } else {
            python -m PyInstaller --onefile --clean --noconfirm --name "ScarnsNameSniffer" roblox_name_gen.py
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ScarnsNameSniffer-v2.1.2-Windows
          path: dist/ScarnsNameSniffer.exe
          if-no-files-found: error

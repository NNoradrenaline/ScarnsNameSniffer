name: Build Windows EXE

# v2.6 clean build: never commits or pushes from inside GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "roblox_name_gen.py"
      - "v25_launcher.py"
      - "v26_engine.py"
      - "v26_entry.py"
      - "requirements.txt"
      - "icon.ico"
      - "browser-extension/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify source
        shell: pwsh
        run: |
          python -m py_compile roblox_name_gen.py
          python -m py_compile v25_launcher.py
          python -m py_compile v26_engine.py
          python -m py_compile v26_entry.py
          python -m py_compile tests/test_v26_engine.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Test v2.6 engine
        shell: pwsh
        run: python -m unittest tests.test_v26_engine -v

      - name: Build Scarn's Name Sniffer v2.6
        shell: pwsh
        run: |
          if (Test-Path "icon.ico") {
            python -m PyInstaller --onefile --clean --noconfirm --name "ScarnsNameSniffer" --icon "icon.ico" v26_entry.py
          } else {
            python -m PyInstaller --onefile --clean --noconfirm --name "ScarnsNameSniffer" v26_entry.py
          }

      - name: Stage v2.6 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/ScarnsNameSniffer.exe package/ScarnsNameSniffer.exe
          Copy-Item browser-extension package/browser-extension -Recurse
          Compress-Archive -Path browser-extension\* -DestinationPath package\ScarnsNameSniffer-Autofill-v2.6.zip -Force
          Compress-Archive -Path browser-extension\* -DestinationPath ScarnsNameSniffer-Autofill-v2.6.zip -Force

      - name: Upload full Windows + extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: ScarnsNameSniffer-v2.6-Windows
          path: package
          if-no-files-found: error

      - name: Upload release-ready extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScarnsNameSniffer-v2.6-Autofill-Extension
          path: ScarnsNameSniffer-Autofill-v2.6.zip
          if-no-files-found: error
